openapi: 3.0.0
info:
  title: Kazi Connect API
  version: 1.2.0
  description: >
    Kazi Connect job listings and job applications for SettleIn students, plus accounts and
    employer tools for the FundiLink website. Endpoint numbers match ENDPOINT_LIST.md, and each
    endpoint names the need statement it serves. Endpoints marked with a lock need a login token:
    log in with Endpoint 11, then send the token as "Authorization: Bearer <token>".
servers:
  - url: http://localhost:3000
    description: Local development server

paths:

  #---ENDPOINT 1 and ENDPOINT 2 (same path; Endpoint 2 adds the county and category filters)---
  /api/jobs:
    get:
      summary: Returns active job/service listings, optionally filtered by county and category
      description: >
        Endpoint 1 (Statement 1): send only status=active to get every active listing.
        Endpoint 2 (Statement 2): also send county and category to get the active listings near a
        student's accommodation. The filters are query parameters on the jobs resource, not a
        separate path. An empty list means nothing matched.
      parameters:
        - name: status
          in: query
          required: true
          description: active returns jobs that can still be requested; closed returns jobs that are filled or withdrawn.
          schema:
            type: string
            example: active
        - name: county
          in: query
          required: false
          description: Endpoint 2 filter. Matches the job's county, ignoring upper and lower case.
          schema:
            type: string
            example: Nairobi
        - name: category
          in: query
          required: false
          description: Endpoint 2 filter. Matches the job's category, ignoring upper and lower case.
          schema:
            type: string
            example: accommodation
      responses:
        '200':
          description: The matching job listings. Empty list if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '400':
          description: status is missing, or county or category was sent empty.

    # ENDPOINT 14 (same path as Endpoints 1 and 2)
    post:
      summary: Posts a new job (employers only)
      description: FundiLink Statement F2. The kind of work is saved in lower case. A new job starts active.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewJob'
      responses:
        '201':
          description: Job posted. The Location header points to the new job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: The body failed validation. Nothing is posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'payRange.min must not be more than payRange.max'
        '401':
          $ref: '#/components/responses/NotLoggedIn'
        '403':
          $ref: '#/components/responses/Forbidden'

  #---ENDPOINT 3---
  /api/jobs/{jobId}:
    get:
      summary: Returns a single job's full details, including status and pay range
      description: Statements 3 and 4.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The unique identifier of the job
          schema:
            type: string
            example: job_12345
      responses:
        '200':
          description: Job details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job ID not found.

    # ENDPOINT 17 (same path as Endpoint 3)
    patch:
      summary: Closes or reopens a job (the employer who posted it)
      description: >
        FundiLink Statement F4. Closing a job marks every application still waiting on it as
        filled, and subscribers to those applications hear about it live. Sending the same status
        twice leaves the job in the same state.
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            example: job_12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobStatusUpdate'
      responses:
        '200':
          description: Job updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: status must be active or closed, and no other fields are allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'status must be active or closed'
        '401':
          $ref: '#/components/responses/NotLoggedIn'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Job ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Job job_99999 not found'

  #---ENDPOINT 4---
  /api/jobs/{jobId}/status:
    get:
      summary: Returns just the availability status of a job
      description: >
        Statement 3. A lightweight check that SettleIn can poll often without pulling the full job.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The unique identifier of the job
          schema:
            type: string
            example: job_12345
      responses:
        '200':
          description: Job availability retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          description: Job ID not found.

  #---ENDPOINT 16---
  /api/jobs/{jobId}/applications:
    get:
      summary: Lists the applicants for a job (the employer who posted it)
      description: >
        FundiLink Statement F3. Newest first. An empty list means nobody has applied yet. Each
        applicant includes studentName when the application came from a Kazi Connect account.
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            example: job_12345
      responses:
        '200':
          description: The job's applicants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Applicant'
        '401':
          $ref: '#/components/responses/NotLoggedIn'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Job ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Job job_99999 not found'

  #---ENDPOINT 5---
  /api/applications/{applicationId}/status:
    get:
      summary: Returns the current status of an application/service request
      description: Statement 5.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            example: app_1001
      responses:
        '200':
          description: Successful response containing the application status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatus'
        '404':
          description: Application ID not found.

  #---ENDPOINT 6---
  /api/applications/{applicationId}/subscribe:
    get:
      summary: Opens a WebSocket that pushes status changes in real time (accepted / filled)
      description: >
        Statement 5. This is a plain GET that upgrades to a WebSocket, so connect with a WebSocket
        client (ws://), not a normal HTTP request. On connect the server sends the current status
        once, then sends a new message every time the status changes, for example to accepted or
        filled. Every message is a JSON ApplicationStatus object. If the application is cancelled
        with DELETE, a final message with status "cancelled" is sent and the server closes the
        connection. Swagger UI cannot open WebSockets, so Try it out returns 426 for this endpoint.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            example: app_1001
      responses:
        '101':
          description: Switching Protocols. The real time stream subscription is established.
        '404':
          description: Application ID not found. The connection is refused.
        '426':
          description: Upgrade Required. The request was plain HTTP, not a WebSocket upgrade.

  #---ENDPOINT 7---
  /api/applications:
    post:
      summary: Creates a new application/service request from a SettleIn student
      description: >
        Statement 6. The job must exist and be active. Each call creates a new application, so this
        endpoint is not idempotent: sending the same body twice creates two applications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApplication'
      responses:
        '201':
          description: Application successfully created. The Location header points to the new application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: >
            The body failed validation: a required field is missing, a field has the wrong type,
            a value is unusable (empty text, not a real date-time, a date in the past), a field
            is not allowed, or jobId does not match any job. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Missing required field(s): preferredDate'
        '409':
          description: The job exists but is closed, so it is not accepting applications. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Job job_12350 is closed and is not accepting applications

  #---ENDPOINT 8 and ENDPOINT 9 (same path, different methods)---
  /api/applications/{applicationId}:
    put:
      summary: Updates an existing pending application (e.g. reschedule, edit details)
      description: >
        Statement 7. Replaces the editable details of a pending application. This sets an absolute
        state: leaving note out clears it, and sending the same body twice leaves the application in
        the same state. A PUT to an ID that does not exist returns 404 and never creates one.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            example: app_1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Application successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: The body failed validation. Nothing is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'preferredDate must be a real date-time, for example 2027-01-15T09:00:00Z'
        '404':
          description: Application ID not found. Nothing is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Application app_9999 not found
        '409':
          description: The application is no longer pending (already accepted or filled), so it cannot be changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Application app_1002 is accepted; only pending applications can be changed'
    delete:
      summary: Cancels a pending application/service request
      description: >
        Statement 8. Removes a pending application. Afterwards Endpoint 5 returns 404 for it, and
        Endpoint 6 subscribers receive a final message with status "cancelled".
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            example: app_1004
      responses:
        '204':
          description: Application successfully cancelled. No body.
        '404':
          description: Application ID not found, including one that was already cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Application app_9999 not found
        '409':
          description: The application is no longer pending (already accepted or filled), so it cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Application app_1002 is accepted; only pending applications can be cancelled'
    # ENDPOINT 18 (same path as Endpoints 8 and 9)
    patch:
      summary: Accepts an application (the employer who posted the job)
      description: >
        FundiLink Statement F3, and SettleIn Statement 5. The application becomes accepted, every
        other application still waiting for the same job becomes filled, and the job closes.
        Subscribers to each application hear about the change live.
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            example: app_1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDecision'
      responses:
        '200':
          description: Application accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: status must be accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'status must be accepted'
        '401':
          $ref: '#/components/responses/NotLoggedIn'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Application ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Application app_9999 not found'
        '409':
          description: The application is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Application app_1002 is accepted; only pending applications can be accepted'

  #---ENDPOINT 10---
  /api/auth/register:
    post:
      summary: Creates an account and logs it in
      description: >
        FundiLink Statement F1. The password is stored only as a scrambled hash and is never
        returned. Emails are saved in lower case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Account created. Use the token for endpoints that need a login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: The body failed validation. No account is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'password must be at least 8 characters'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'An account with this email already exists. Log in instead.'

  #---ENDPOINT 11---
  /api/auth/login:
    post:
      summary: Logs in and returns a token
      description: >
        FundiLink Statement F1. A wrong password and an unknown email get exactly the same 401
        message, so the reply never reveals which emails have accounts. Tokens last 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: email or password is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Missing required field(s): password'
        '401':
          description: The email or password is wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Email or password is incorrect.'

  #---ENDPOINT 12---
  /api/auth/logout:
    post:
      summary: Logs out, so the token stops working
      description: FundiLink Statement F1.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out. No body.
        '401':
          $ref: '#/components/responses/NotLoggedIn'

  #---ENDPOINT 20---
  /api/auth/password-resets:
    post:
      summary: Asks for a password reset email ("Forgot password?")
      description: >
        FundiLink Statement F6. The reply is always the same 202, whether or not the email has an
        account, so it never reveals who is registered. If the account exists, a single use link
        that works for 30 minutes is emailed to it. At most 3 reset emails are sent per account
        per hour; further requests still get 202 but send nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted. Check the inbox if the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: email is missing or is not an email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'email must be a valid email address'

  #---ENDPOINT 21---
  /api/auth/password:
    put:
      summary: Sets a new password using the token from the reset email
      description: >
        FundiLink Statement F6. Works once, within 30 minutes of the email. Afterwards every other
        reset link for the account stops working, and the account is logged out everywhere, so the
        person logs in again with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPassword'
      responses:
        '204':
          description: Password changed. No body.
        '400':
          description: >
            The body failed validation, or the reset token is unknown, already used, or more than
            30 minutes old. Nothing is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This reset link is not valid or has expired. Ask for a new one.'

  #---ENDPOINT 13---
  /api/me:
    get:
      summary: Returns the logged in user
      description: FundiLink Statement F1.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The logged in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/NotLoggedIn'

  #---ENDPOINT 15---
  /api/me/jobs:
    get:
      summary: Lists the jobs the logged in employer posted
      description: FundiLink Statement F2. Newest first, each with how many applications are waiting.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The employer's jobs. Empty list if none posted yet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployerJob'
        '401':
          $ref: '#/components/responses/NotLoggedIn'
        '403':
          $ref: '#/components/responses/Forbidden'

  #---ENDPOINT 19---
  /api/me/applications:
    get:
      summary: Lists the logged in student's applications
      description: >
        FundiLink Statement F5. Applications whose studentId is the student's account ID, newest
        first. Empty list if the student has not applied yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The student's applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/NotLoggedIn'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'The token from Endpoint 10 or 11, sent as "Authorization: Bearer <token>".'
  responses:
    NotLoggedIn:
      description: No token was sent, or it is not valid, or it has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Your session has expired or is not valid. Log in again.'
    Forbidden:
      description: Logged in, but this account is not allowed to do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'You can only manage jobs you posted.'
  schemas:
    Job:
      type: object
      required: [id, title, category, county, area, duration, urgent, status, payRange]
      properties:
        id:
          type: string
          example: job_12345
        title:
          type: string
          example: Campus Housing Assistant
        category:
          type: string
          example: accommodation
        county:
          type: string
          example: Nairobi
        area:
          type: string
          description: The estate or neighbourhood within the county.
          example: Parklands
        duration:
          type: string
          description: How long the work takes, in plain words.
          example: Part time, 3 months
        urgent:
          type: boolean
          description: true when the employer needs someone quickly.
          example: true
        status:
          type: string
          enum: [active, closed]
          description: active means the job can still be requested; closed means it is filled or withdrawn.
          example: active
        payRange:
          type: object
          required: [min, max]
          properties:
            min:
              type: number
              example: 15000
            max:
              type: number
              example: 22000
    JobStatus:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          example: job_12345
        status:
          type: string
          enum: [active, closed]
          description: active means the job can still be requested; closed means it is filled or withdrawn.
          example: active
    ApplicationStatus:
      type: object
      required: [applicationId, status]
      properties:
        applicationId:
          type: string
          example: app_1001
        status:
          type: string
          enum: [pending, accepted, filled, cancelled]
          description: >
            pending is waiting for a decision, accepted means the request was accepted, filled means
            the job went to someone else, and cancelled only ever appears as the final Endpoint 6
            message after a DELETE.
          example: pending
    Application:
      type: object
      required: [applicationId, jobId, studentId, preferredDate, note, status]
      properties:
        applicationId:
          type: string
          example: app_1005
        jobId:
          type: string
          example: job_12345
        studentId:
          type: string
          example: stu_0042
        preferredDate:
          type: string
          format: date-time
          example: '2027-01-15T09:00:00Z'
        note:
          type: string
          description: Empty string when the student left no note.
          example: Available after 2pm on weekdays
        status:
          type: string
          enum: [pending, accepted, filled]
          example: pending
    NewApplication:
      type: object
      additionalProperties: false
      required: [jobId, studentId, preferredDate]
      properties:
        jobId:
          type: string
          minLength: 1
          description: Must match an existing, active job.
          example: job_12345
        studentId:
          type: string
          minLength: 1
          example: stu_0042
        preferredDate:
          type: string
          format: date-time
          description: When the student wants the service. Must be a real date-time in the future.
          example: '2027-01-15T09:00:00Z'
        note:
          type: string
          maxLength: 500
          example: Available after 2pm on weekdays
    ApplicationUpdate:
      type: object
      additionalProperties: false
      required: [preferredDate]
      properties:
        preferredDate:
          type: string
          format: date-time
          description: The new date and time. Must be a real date-time in the future.
          example: '2027-01-22T14:00:00Z'
        note:
          type: string
          maxLength: 500
          description: Replaces the existing note. Leave it out to clear the note.
          example: Rescheduled to the following week
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: 'Missing required field(s): preferredDate'
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          example: usr_1001
        name:
          type: string
          example: Demo Employer
        email:
          type: string
          format: email
          example: employer@kaziconnect.demo
        role:
          type: string
          enum: [student, employer]
          example: employer
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 64 character login token. Valid for 7 days or until logout.
          example: 4f1c2a9e0b7d4e6f8a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f3a5b7c9d1e3f
        user:
          $ref: '#/components/schemas/User'
    NewUser:
      type: object
      additionalProperties: false
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Amina Otieno
        email:
          type: string
          format: email
          example: amina@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: choose-a-long-password
        role:
          type: string
          enum: [student, employer]
          example: student
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          example: employer@kaziconnect.demo
        password:
          type: string
          format: password
          example: KaziDemo2026
    NewJob:
      type: object
      additionalProperties: false
      required: [title, category, county, area, duration, payRange]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          example: Fix leaking kitchen sink
        category:
          type: string
          minLength: 2
          maxLength: 40
          description: The kind of work. Saved in lower case.
          example: plumbing
        county:
          type: string
          minLength: 2
          maxLength: 40
          example: Nairobi
        area:
          type: string
          minLength: 2
          maxLength: 60
          example: Westlands
        duration:
          type: string
          minLength: 2
          maxLength: 40
          example: About 2 hours
        urgent:
          type: boolean
          description: Leave out for false.
          example: true
        payRange:
          type: object
          additionalProperties: false
          required: [min, max]
          description: Pay in Kenyan shillings. min must not be more than max.
          properties:
            min:
              type: number
              minimum: 0
              maximum: 10000000
              example: 1500
            max:
              type: number
              minimum: 0
              maximum: 10000000
              example: 1500
    EmployerJob:
      type: object
      description: A Job, plus how many applications are waiting for a decision.
      required: [id, title, category, county, area, duration, urgent, status, payRange, pendingApplications]
      properties:
        id:
          type: string
          example: job_12345
        title:
          type: string
          example: Campus Housing Assistant
        category:
          type: string
          example: accommodation
        county:
          type: string
          example: Nairobi
        area:
          type: string
          example: Parklands
        duration:
          type: string
          example: Part time, 3 months
        urgent:
          type: boolean
          example: true
        status:
          type: string
          enum: [active, closed]
          example: active
        payRange:
          type: object
          required: [min, max]
          properties:
            min:
              type: number
              example: 15000
            max:
              type: number
              example: 22000
        pendingApplications:
          type: integer
          minimum: 0
          example: 1
    Applicant:
      type: object
      description: An Application, plus the applicant's name for the employer deciding on it.
      required: [applicationId, jobId, studentId, preferredDate, note, status, studentName]
      properties:
        applicationId:
          type: string
          example: app_1005
        jobId:
          type: string
          example: job_12346
        studentId:
          type: string
          example: usr_1003
        preferredDate:
          type: string
          format: date-time
          example: '2027-01-15T09:00:00Z'
        note:
          type: string
          example: Free after lectures
        status:
          type: string
          enum: [pending, accepted, filled]
          example: pending
        studentName:
          type: string
          description: Empty when the application did not come from a Kazi Connect account, for example one SettleIn created.
          example: Amina Otieno
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: student@kaziconnect.demo
    NewPassword:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: The 64 character token from the reset link in the email.
          pattern: '^[a-f0-9]{64}$'
          example: 9c1e4b7a2d5f8e0b3a6c9d2f5e8b1a4c7d0e3f6a9b2c5d8e1f4a7b0c3d6e9f2a
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: choose-a-new-password
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: 'If an account exists for that email, we have sent a link to reset its password. The link works for 30 minutes.'
    JobStatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, closed]
          example: closed
    ApplicationDecision:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]
          example: accepted
